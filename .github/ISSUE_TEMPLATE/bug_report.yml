name: Bug report
description: Something in bn behaves differently from the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through [private reporting](https://github.com/sglavoie/brainnotes/security/advisories/new), not here.
        Please never paste private note contents; a minimal throwaway vault is ideal.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `bn --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, and browser if the problem is in `bn serve`. Mention `--hosted` or `--read-only` if used.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
