version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    versioning-strategy: increase
    # Bundled packages (@codemirror/*, cytoscape) change the committed web
    # assets: these PRs need `just web-build` before `just ci` passes.
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        update-types: [minor, patch]
