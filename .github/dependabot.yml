version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    versioning-strategy: increase
    groups:
      # Bundled into the committed web assets: these PRs need `just web-build`.
      web-runtime:
        patterns: ["@codemirror/*", "cytoscape"]
        update-types: [minor, patch]
      # Playwright bumps can move visual baselines; keep them reviewable alone.
      playwright:
        patterns: ["@playwright/test", "@axe-core/playwright"]
      dev-tooling:
        patterns: ["*"]
        exclude-patterns: ["@codemirror/*", "cytoscape", "@playwright/test", "@axe-core/playwright"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
