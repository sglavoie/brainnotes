name: Browser qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

# A second dispatch while one qualification runs replaces it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run all regressions and qualify hosted browsers
        run: npm run test:e2e:weekly
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-browser-evidence
          path: internal/web/e2e/.artifacts/results
          retention-days: 14
