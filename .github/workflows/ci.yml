name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository and uploads artifacts, which needs no
# token scope beyond reading contents.
permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight. Pushes to main
# queue instead, so every commit there keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # `just ci` runs the complexity ratchet, which diffs against the baseline
      # commit named by `ratchet_base` in the justfile. The default shallow
      # checkout fetches one commit, so that commit would not exist here and
      # golangci-lint could not resolve a merge base. Full history is what makes
      # the gate runnable in CI at all.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install frontend dependencies
        run: npm ci

      # The version is pinned in the justfile and installed through it, so the
      # workflow and a developer machine cannot end up on different linters.
      - name: Install the pinned golangci-lint
        run: just install-lint

      # The job runs golangci-lint over the whole tree twice (the phase gate,
      # then `just lint-new` inside `just ci`) plus two self-tests. Its analysis
      # cache is keyed on what can change a result: dependencies and the linter
      # configuration. A restored cache only skips re-analysis of unchanged
      # packages; golangci-lint still re-checks anything whose source changed.
      - name: Cache golangci-lint analysis
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      # The ratchet's own regression test, kept out of `just ci` because it
      # builds a throwaway repository and runs golangci-lint a second time — a
      # cost the local envelope should not pay on every run. It belongs here
      # instead of nowhere: the gate it protects reads as green while enforcing
      # nothing when it breaks, which is exactly the failure it was written for.
      - name: Self-test the complexity ratchet
        run: just lint-ratchet-selftest

      # Same reasoning for the Phase 1 gate, which has already been green while
      # enforcing less than it claimed: it checked command constructors only, so
      # 21 production complexity violations in internal/cli passed under it.
      # Kept out of `just ci` because only one golangci-lint may run at a time.
      - name: Self-test the phase gate
        run: just lint-phase-gate-selftest

      # The gate itself: production internal/cli code must carry no complexity
      # violation. Separate from `just ci` for the same single-run reason.
      - name: Phase gate
        run: just lint-phase-gate

      - name: Run CI checks
        run: just ci

  # The race detector over the concurrency-heavy packages (see `just test-race`).
  # A separate job because -race multiplies test time, and the main job's
  # envelope should stay what `just ci` runs locally.
  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Run the race detector
        run: just test-race

  browser:
    name: Browser polish and shipped assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      # Test the committed embedded assets. Rebuilding here would conceal drift.
      - name: Check local, hosted and read-only journeys and responsive layouts
        run: npm run test:e2e:pr
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: internal/web/e2e/.artifacts/results
          retention-days: 7

  visual:
    name: Visual baselines (macOS Chromium)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e -- --project=visual-chromium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-differences
          path: internal/web/e2e/.artifacts/results
          retention-days: 7

  # internal/vault replaces an existing note with a native, platform-specific
  # primitive and refuses to write at all where it cannot prove that primitive on
  # the target volume. Cross-compiling only proves the code builds; the semantics
  # it depends on — an exchange that never leaves the destination name absent —
  # are a property of the kernel and the filesystem under the runner, so the
  # package's tests have to actually execute on each supported platform.
  #
  # The Ubuntu job above stays authoritative for the repository as a whole. This
  # matrix adds nothing to it on Linux beyond a second run of one package; its
  # reason to exist is macOS and Windows.
  vault-native:
    name: vault (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run internal/vault tests on the native filesystem
        run: go test -count=1 ./internal/vault/...
