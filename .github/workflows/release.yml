name: Release

# Pushing a `v*` tag builds `bn`, `bn-vault-guard` and `bn-vault-sync` for every
# supported platform (macOS and Linux; see docs/internals/locking.md for why not
# Windows) and publishes them as a GitHub Release. A manual run builds
# the same archives and uploads them as a workflow artifact without publishing,
# which is how to check a change to this file.
#
# The three binaries ship in one archive per platform because they must run from
# the same source (see internal/buildinfo). Every binary is built from the same
# checkout, so Go stamps the same `vcs.revision` into each and `bn --version`
# reports the tagged commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Every platform cross-compiles from here: nothing in the module uses cgo.
      # The archives are staged outside the checkout: an untracked file in the
      # working tree would make Go stamp the binaries as `-dirty`. A tagged
      # release reports its tag as the build identifier; a manual run keeps the
      # Git revision Go stamps.
      - name: Build archives
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          STAMP: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          ldflags="-s -w"
          if [ -n "$STAMP" ]; then
            ldflags="$ldflags -X github.com/sglavoie/brainnotes/internal/buildinfo.revision=$STAMP"
          fi
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="brainnotes_${VERSION}_${goos}_${goarch}"
            stage="$dist/$name"
            mkdir -p "$stage"
            for cmd in bn bn-vault-guard bn-vault-sync; do
              GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" -o "$stage/$cmd" "./cmd/$cmd"
            done
            cp LICENSE README.md THIRD_PARTY_NOTICES.md "$stage/"
            tar -C "$dist" -czf "$dist/$name.tar.gz" "$name"
            rm -rf "$stage"
          done
          (cd "$dist" && sha256sum * > checksums.txt)
          ls -l "$dist"

      - name: Smoke-test the Linux binaries
        env:
          STAMP: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          tar -C "$dir" -xzf "$RUNNER_TEMP"/dist/*_linux_amd64.tar.gz
          for cmd in bn bn-vault-guard bn-vault-sync; do
            version="$("$dir"/*/"$cmd" --version)"
            echo "$version"
            id="${version##* }"
            case "$id" in *-dirty|unknown) echo "$cmd is not stamped with a clean revision" >&2; exit 1;; esac
            if [ -n "$STAMP" ] && [ "$id" != "$STAMP" ]; then
              echo "$cmd reports $id, want the tag $STAMP" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
