{{define "new-note"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/static/favicon.svg">
  <title>New note - bn serve</title>
  {{template "themeBoot" .}}
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{template "workspaceSkip" .}}
  <main class="index-main">
    <header class="site-header focused-workspace-header">
      <h1>New note</h1>
      {{template "workspaceMenu" "new"}}
    </header>
    {{template "siteSync" .}}
    <a data-note-back-results hidden></a>
    <p class="page-subtitle">Start with what’s on your mind. You can shape it as you go.</p>

    <form id="workspace-content" tabindex="-1" class="panel new-note" data-new-note data-new-note-write-first data-new-note-vault="{{.VaultID}}" data-create-endpoint="{{.CreatePath}}" data-editor-path="{{.EditorPath}}" data-csrf="{{.CSRFToken}}">
      <label for="new-note-body">Your thought (optional)</label>
      <textarea id="new-note-body" name="body" rows="8" maxlength="20000" placeholder="What would you like to remember?" autofocus>{{.SuggestedBody}}</textarea>
      <div class="new-note-naming">
        <label for="new-note-title">Title</label>
        <input id="new-note-title" name="title" type="text" value="{{.SuggestedTitle}}" required autocomplete="off" placeholder="Suggested from your first sentence" aria-describedby="new-note-destination">
        <div class="new-note-location">
          <label for="new-note-folder">Folder (optional)</label>
          <input id="new-note-folder" name="folder" type="text" placeholder="Vault root" autocomplete="off" data-folder-suggestions aria-describedby="new-note-folder-hint new-note-destination">
        </div>
        <p id="new-note-folder-hint" class="new-note-folder-hint">Choose an existing folder or type a new path.</p>
        <p id="new-note-destination" data-new-note-destination></p>
      </div>
      <div><button class="bn-button" type="submit">Create and write</button></div>
      <p data-new-note-draft-status role="status"></p>
      <p data-new-note-status role="status" aria-live="polite"></p>
      <noscript>Enable JavaScript to create and edit notes.</noscript>
    </form>
  </main>
  <script src="/static/app.js" defer></script>
  <script src="/static/workspace-actions.js" defer></script>
</body>
</html>
{{end}}
