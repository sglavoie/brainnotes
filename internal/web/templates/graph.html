{{define "graph"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/cytoscape.min.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body class="graph-page">
    <main class="graph-main">
      <header class="graph-header">
        <div class="graph-header-copy">
          <h1>Graph</h1>
          <p id="graph-status" role="status">Loading graph...</p>
          <p class="graph-links">
            <a href="/">Overview</a>
            <a href="/broken">Broken links</a>
          </p>
        </div>
        <section class="graph-controls" aria-label="Graph controls">
          <div class="graph-filter">
            <label class="graph-control-label" for="graph-filter-input">Filter graph</label>
            <input
              id="graph-filter-input"
              class="graph-filter-input"
              type="search"
              placeholder="Filter graph by title or body..."
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          {{template "facetControls" .FacetControls}}
          <div class="graph-spread">
            <div class="graph-spread-header">
              <label class="graph-control-label" for="graph-spread-input">Spread</label>
              <output id="graph-spread-value" for="graph-spread-input">2.0x</output>
            </div>
            <input
              id="graph-spread-input"
              class="graph-spread-input"
              type="range"
              min="0.8"
              max="6.0"
              step="0.1"
              value="2.0"
            />
          </div>
          <div class="graph-action-controls" aria-label="Graph viewport">
            <button id="graph-fit-button" class="graph-control-button" type="button">Fit graph</button>
            <button id="graph-reset-layout-button" class="graph-control-button" type="button">Reset layout</button>
          </div>
          <fieldset class="graph-label-mode" aria-label="Label mode">
            <legend class="graph-control-label">Labels</legend>
            <div class="graph-label-mode-options">
              <label class="graph-label-mode-option">
                <input id="graph-label-mode-auto" type="radio" name="graph-label-mode" value="auto" checked />
                <span>Auto</span>
              </label>
              <label class="graph-label-mode-option">
                <input id="graph-label-mode-all" type="radio" name="graph-label-mode" value="all" />
                <span>All</span>
              </label>
            </div>
          </fieldset>
        </section>
      </header>
      <section class="graph-panel">
        <div id="graph-canvas" aria-label="Notes graph" tabindex="0"></div>
        <aside class="graph-hover" aria-live="polite">
          <h2>Node details</h2>
          <p id="graph-hover-title">Hover a node</p>
          <p id="graph-hover-folder"></p>
          <p id="graph-hover-degree"></p>
          <ul id="graph-hover-issues" class="graph-issue-list" aria-label="Node issues" hidden></ul>
          <a id="graph-open-note" class="graph-open-note is-disabled" aria-disabled="true" tabindex="-1">Open note</a>
        </aside>
      </section>
    </main>
  </body>
</html>
{{end}}
