{{define "headerSearch"}}
  <section class="search-box" data-search-box>
    <label class="search-label" for="search-input">Search notes <span class="search-shortcut-hint">(<kbd>/</kbd> to focus)</span></label>
    <input
      id="search-input"
      class="search-input"
      type="search"
      aria-keyshortcuts="/"
      placeholder="Search title or body…"
      autocomplete="off"
      spellcheck="false"
      role="combobox"
      aria-autocomplete="list"
      aria-controls="search-results"
      aria-describedby="search-keyboard-hint"
      aria-expanded="false"
    />
    <a class="search-library-link" data-search-library href="/library" hidden>Open results in Library (Enter when no note is selected)</a>
    <p id="search-keyboard-hint" class="search-label" data-search-keyboard-hint hidden>↑↓ select · Enter open · Esc dismiss</p>
    <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    <div id="search-feedback" class="search-feedback" data-search-feedback hidden>
      <span data-search-feedback-message role="status" aria-live="polite"></span>
      <button type="button" data-search-retry hidden>Retry search</button>
    </div>
  </section>
{{end}}

{{define "librarySearch"}}
  <div class="search-box" data-search-box data-library-search-input>
    <label class="search-label" for="search-input">Search notes <span class="search-shortcut-hint">(<kbd>/</kbd> to focus)</span></label>
    <input id="search-input" class="search-input" type="search" aria-keyshortcuts="/" placeholder="Search title or body…" autocomplete="off" spellcheck="false" aria-controls="library-results-list" aria-describedby="overview-results-status">
  </div>
{{end}}
