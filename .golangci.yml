# Function-complexity ratchet. See docs/internals/refactor-baseline.md.
#
# This config is measurement and gate at once: `just lint-full` runs it over the
# whole tree to report the remaining count, and `just lint` / `just ci` run it
# over new code only so the existing violations do not block while no new one
# can land.
#
# The four thresholds below are the ones the baseline was measured with. They
# are duplicated in scripts/metrics_complexity.py, deliberately: that script
# writes its own ephemeral config so a change here cannot silently move the
# numbers docs/internals/refactor-baseline.md records. Changing a threshold
# means changing both files and re-recording the baseline.
version: "2"

# The build tags whose files would otherwise be invisible to every linter here.
#
# `synctransport` guards the real two-process Syncthing scenarios and
# `syncrecovery` guards the long seeded delivery schedules. Their dedicated
# recipes run outside `just ci`. A gate that judged a function's complexity only
# when a tag happened to be set would stop applying the moment somebody moved
# code behind one, so the ratchet reads both the same as everything else. The
# transport harness itself carries no tag and is covered without this.
run:
  build-tags:
    - synctransport
    - syncrecovery

linters:
  default: none
  enable:
    - cyclop
    - funlen
    - gocognit
    - nestif

  settings:
    cyclop:
      max-complexity: 10
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 4

  exclusions:
    # Generated files carry a "Code generated ... DO NOT EDIT" header and are
    # not hand-maintained, so a complexity score for them is not actionable.
    generated: lax
    paths:
      # Generated Unicode normalization tables. Excluded by path as well as by
      # header so the exclusion survives a regenerator that drops the header.
      - internal/template/unicode_normalize.*\.go$
      - internal/template/unicode_combining_class.*\.go$
      # Build output and vendored third-party assets. No Go files today; listed
      # so this file names the same generated paths as .refactorignore and the
      # bundle-drift check in `just ci`.
      - internal/web/static/
      # npm dependencies that happen to ship Go source. `eslint` pulls in
      # `flatted`, which vendors a Go port under node_modules/flatted/golang,
      # and Go's `./...` matcher skips testdata, vendor and dot/underscore
      # directories but NOT node_modules — so without this the floor recorded in
      # docs/internals/refactor-baseline.md moves whenever a dependency does.
      # internal/audit's own repository walk already skips node_modules by name.
      - node_modules/

issues:
  # The gate must report every violation it finds. golangci-lint truncates to 50
  # per linter and 3 identical messages by default, which would let a new
  # violation land unreported once a linter's list is long.
  max-issues-per-linter: 0
  max-same-issues: 0

  # Left at the default, and stated so it is a decision rather than a default.
  # cyclop and gocognit both report on a function's declaration line, so a
  # function over both thresholds collapses to one issue here. That is why a
  # whole-tree total can be lower than the sum of raw per-linter runs. This is
  # what docs/internals/refactor-baseline.md and the ephemeral config in
  # scripts/metrics_complexity.py both measure. It cannot weaken the gate:
  # collapsing needs two issues on one line, so one is always reported.
  uniq-by-line: true
